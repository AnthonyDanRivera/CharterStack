name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend (lint + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      # Run tests against PostgreSQL, the production database, not SQLite.
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: charterstack
          POSTGRES_PASSWORD: charterstack
          POSTGRES_DB: charterstack
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U charterstack"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://charterstack:charterstack@localhost:5432/charterstack
      SECRET_KEY: ci-only-secret
      DEBUG: "true"
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format check
        run: uv run ruff format --check .
      - name: Check for missing migrations
        run: uv run python manage.py makemigrations --check --dry-run
      - name: Tests
        run: uv run pytest

  frontend:
    name: Frontend (lint + tests + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build

  docker:
    name: Production image builds and serves the app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build image
        run: docker build -t charterstack:ci .
      - name: Start against SQLite and check health, app shell and admin
        run: |
          docker run -d --name app -p 8000:8000 \
            -e SECRET_KEY=ci-only -e DEBUG=false -e SECURE_SSL_REDIRECT=false \
            -e ALLOWED_HOSTS=localhost -e DATABASE_URL=sqlite:////tmp/ci.sqlite3 \
            charterstack:ci
          for i in $(seq 1 30); do curl -fs http://localhost:8000/api/health/ && break; sleep 2; done
          curl -fs http://localhost:8000/api/health/
          curl -fs http://localhost:8000/ | grep -q '<div id="root">'
          curl -fs -o /dev/null http://localhost:8000/admin/login/
      - name: Show container logs on failure
        if: failure()
        run: docker logs app
